distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 国内可用腾讯云镜像，避免 services.gradle.org 下载超时（与官方包一致）
# 使用 -all 而非 -bin：内含源码与文档，IDE 在为 Kotlin DSL 建模型时不再单独拉取
# gradle-*-src.zip（否则易走 services.gradle.org / GitHub 导致 Connection reset）
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-all.zip
networkTimeout=300000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
